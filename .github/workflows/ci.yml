name: CI

on:
  push:
  pull_request:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install bootstrap tools
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential verilator
      - name: Run local CI flow
        run: make ci